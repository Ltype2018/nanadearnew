
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲爱的娜娜</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            font-family: 'Ma Shan Zheng', cursive;
            overflow: hidden;
        }
        
        .heart-container {
            position: relative;
            width: 50vmin;
            height: 50vmin;
            margin: 20px 0;
        }
        
        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff3366, #ff0033);
            transform: rotate(45deg);
            animation: heartbeat 1.4s ease-in-out infinite;
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.6);
        }
        
        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff3366, #ff0033);
            border-radius: 50%;
        }
        
        .heart:before {
            top: -50%;
            left: 0;
        }
        
        .heart:after {
            top: 0;
            left: -50%;
        }
        
        .message {
            font-size: 5vmin;
            color: #d81b60;
            text-align: center;
            line-height: 1.6;
            margin-top: 100px;
            max-width: 90%;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            animation: textPulse 1.4s ease-in-out infinite;
        }
        
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        @keyframes heartbeat {
            0% { transform: rotate(45deg) scale(1); }
            14% { transform: rotate(45deg) scale(1.3); }
            28% { transform: rotate(45deg) scale(1); }
            42% { transform: rotate(45deg) scale(1.3); }
            70% { transform: rotate(45deg) scale(1); }
        }
        
        @keyframes textPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="heart-container">
        <div class="heart" id="mainHeart"></div>
    </div>
    
    <div class="message">
        娜娜我们已经认识很久了<br>
        每次想起你就心跳加速
    </div>
    
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const heart = document.getElementById('mainHeart');
            const container = document.getElementById('floatingHearts');
            
            // 点击爱心效果
            heart.addEventListener('click', function() {
                this.style.transform = 'rotate(45deg) scale(1.3)';
                setTimeout(() => {
                    this.style.transform = 'rotate(45deg) scale(1)';
                }, 300);
                
                createHearts(10);
            });
            
            // 创建漂浮小心心
            function createHearts(count) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.style.position = 'absolute';
                        heart.style.width = Math.random() * 30 + 10 + 'px';
                        heart.style.height = heart.style.width;
                        heart.style.left = Math.random() * 100 + '%';
                        heart.style.bottom = '0';
                        heart.style.background = `rgba(255, ${Math.random() * 100 + 50}, ${Math.random() * 100 + 100}, 0.7)`;
                        heart.style.borderRadius = '50%';
                        heart.style.transform = 'rotate(45deg)';
                        heart.style.animation = `float ${Math.random() * 3 + 3}s linear forwards`;
                        
                        container.appendChild(heart);
                        
                        setTimeout(() => {
                            heart.remove();
                        }, 5000);
                    }, i * 200);
                }
            }
            
            // 初始漂浮小心心
            setInterval(() => {
                createHearts(1);
            }, 1000);
        });
    </script>
</body>
</html>
