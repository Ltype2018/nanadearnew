<!doctype html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>温柔提醒</title>
  <style>
    :root {
      --window-width: 180px;
      --padding: 12px;
      --font-size: 14px;
      --font-weight: 700;
      --delay-ms: 600; /* 每条消息间隔 */
      --radius: 14px;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #f8f9fb;
      font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .msg {
      position: fixed;
      width: var(--window-width);
      max-width: calc(100vw - 24px);
      padding: var(--padding);
      font-size: var(--font-size);
      font-weight: var(--font-weight);
      line-height: 1.6;
      text-align: center;
      border-radius: var(--radius);
      box-shadow: 0 6px 24px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.08);
      cursor: pointer;
      user-select: none;
      word-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: scale(0.3) translateY(-20px) rotate(-5deg);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .msg.show {
      opacity: 1;
      transform: scale(1) translateY(0) rotate(0deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    .msg.show {
      animation: float 3s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .msg { transition: none; }
    }

    .hint {
      position: fixed;
      left: 12px; bottom: 12px;
      font-size: 12px;
      color: #666;
      background: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>

    // ---- 颜色相关 ----
    function hsvToRgb(h, s, v) {
      let r, g, b;
      const i = Math.floor(h * 6);
      const f = h * 6 - i;
      const p = v * (1 - s);
      const q = v * (1 - f * s);
      const t = v * (1 - (1 - f) * s);
      switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
      }
      return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
    }

    function toHex(n) {
      return n.toString(16).padStart(2, '0');
    }

    function randomPastelHex() {
      const h = Math.random();
      const s = Math.random() * (0.45 - 0.25) + 0.25;
      const v = Math.random() * (0.98 - 0.92) + 0.92;
      const [r, g, b] = hsvToRgb(h, s, v);
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function luminance(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const toLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
      const R = toLinear(r), G = toLinear(g), B = toLinear(b);
      return 0.2126 * R + 0.7152 * G + 0.0722 * B;
    }

    function pickTextColor(bgHex) {
      return luminance(bgHex) > 0.6 ? '#111111' : '#ffffff';
    }

    // ---- UI 构建与弹窗逻辑 ----
    let zIndexCursor = 10;
    const timeouts = [];

    function createMessageElement(message) {
      const bg = randomPastelHex();
      const fg = pickTextColor(bg);

      const el = document.createElement('div');
      el.className = 'msg';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-label', TITLE);
      el.textContent = message;
      el.style.backgroundColor = bg;
      el.style.color = fg;
      el.style.fontFamily = `${FONT_FAMILY}, \"Noto Sans SC\", \"PingFang SC\", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif`;
      el.style.fontSize = `${FONT_SIZE}px`;
      el.style.fontWeight = FONT_WEIGHT;
      el.style.padding = `${PADDING}px`;
      el.style.width = `${WINDOW_WIDTH}px`;
      el.style.zIndex = zIndexCursor++;

      // 先隐藏并加入文档以测量尺寸
      el.style.visibility = 'hidden';
      el.style.left = '0px';
      el.style.top = '0px';
      document.body.appendChild(el);

      const { clientWidth: w, clientHeight: h } = el;
      const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
      const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

      const maxX = Math.max(0, vw - w);
      const maxY = Math.max(0, vh - h);
      const x = maxX ? Math.floor(Math.random() * (maxX + 1)) : 0;
      const y = maxY ? Math.floor(Math.random() * (maxY + 1)) : 0;

      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.visibility = 'visible';

      // 交互：点击关闭
      el.addEventListener('click', () => {
        el.remove();
      });

      // 轻微延迟以触发过渡
      requestAnimationFrame(() => el.classList.add('show'));

      return el;
    }

    function spawn(index) {
      if (index >= MESSAGES.length) return;
      if(index ===0){
        WINDOW_DELAY_MS = 3000
      }else{
        WINDOW_DELAY_MS = 600
      }
      createMessageElement(MESSAGES[index]);
      const t = setTimeout(() => spawn(index + 1), WINDOW_DELAY_MS);
      timeouts.push(t);
    }

    function start() {
      spawn(0);
    }

    function closeAll() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts.length = 0;
      document.querySelectorAll('.msg').forEach(node => node.remove());
    }

    // Esc 关闭全部
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeAll();
      }
    });




    // 自动开始
    window.addEventListener('load', start);
  </script>
